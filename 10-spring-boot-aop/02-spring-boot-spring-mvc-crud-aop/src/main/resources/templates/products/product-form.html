<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Products</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
          crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h3>Product List</h3>
        <hr>

        <p class="h4 mb-4">Add Product</p>

        <form action="#" th:action="@{/products/save}"
              th:object="${product}" method="POST">

            !-- Add hidden form field to handle update -->
            <input type="hidden" th:field="*{id}" />

            <input type="text" th:field="*{productName}"
                   class="form-control mb-4 w-25" placeholder="Product name">

            <input type="text" th:field="*{sku}"
                   class="form-control mb-4 w-25" placeholder="SKU">

            <input type="text" th:field="*{price}"
                   class="form-control mb-4 w-25" placeholder="Price">

            <input type="text" th:field="*{productDescription}"
                   class="form-control mb-4 w-25" placeholder="Product description">

            <button type="submit" class="btn btn-info col-2">Save</button>

        </form>

        <hr>
        <a th:href="@{/products/list}">Back to Products List</a>

    </div>
</body>
</html>
